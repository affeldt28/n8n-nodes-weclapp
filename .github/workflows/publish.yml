name: 🚀 Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    name: 🌐 Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧰 Release on npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set access public && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}